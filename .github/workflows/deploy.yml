name: Test and deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg (with Opus)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -encoders | grep -i opus

      - name: Run full test suite
        run: python -m pytest -q -ra

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal -r requirements.txt

      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          modal deploy modal_app.py 2>&1 | tee deploy.log
          grep -o 'https://[^[:space:]]*' deploy.log | head -1 > web.url
          echo "WEB_URL=$(cat web.url 2>/dev/null || true)" >> "$GITHUB_ENV"; [ -s web.url ] || echo "WEB_URL=https://donovandeklerk--sisi-web.us-east.modal.run" >> "$GITHUB_ENV"

      - name: Health check
        run: |
          test -n "$WEB_URL"
          curl -sf "$WEB_URL/health"
          echo
          echo "Healthy: $WEB_URL/health"
